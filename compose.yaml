name: aixccelerate-workspace
services:
  postgres:
    image: pgvector/pgvector:pg17
    ports: ["127.0.0.1:55432:5432"]
    environment:
      POSTGRES_DB: aix_workspace
      POSTGRES_USER: aix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aix -d aix_workspace"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: {context: ., target: worker}
    command: ["node", "--import", "tsx", "scripts/migrate.ts"]
    environment: &app-environment
      DATABASE_URL: postgres://aix:${POSTGRES_PASSWORD}@postgres:5432/aix_workspace
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:4173}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?Set CREDENTIAL_ENCRYPTION_KEY}
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
      COMPOSIO_AUTH_CONFIGS: ${COMPOSIO_AUTH_CONFIGS:-}
      UPLOAD_DIR: /data/uploads
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  app:
    build: {context: ., target: app}
    ports: ["127.0.0.1:4173:3000"]
    environment: *app-environment
    volumes: ["uploads:/data/uploads"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
  worker:
    build: {context: ., target: worker}
    environment: *app-environment
    volumes: ["uploads:/data/uploads"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  uploads:
